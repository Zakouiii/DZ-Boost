<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اطلب الآن — Dz Boost</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, 'Segoe UI', 'Tahoma', sans-serif;
            background: #0a0e1a;
            color: #fff;
            min-height: 100vh;
        }
        .bg-orbs { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s infinite ease-in-out;
        }
        .orb1 { width: 400px; height: 400px; background: #833ab4; top: -100px; right: -100px; }
        .orb2 { width: 350px; height: 350px; background: #fd1d1d; bottom: -100px; left: -100px; animation-delay: -7s; }
        .orb3 { width: 300px; height: 300px; background: #fcb045; top: 40%; left: 30%; animation-delay: -14s; }
        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(50px, -50px) scale(1.1); }
            66% { transform: translate(-50px, 50px) scale(0.9); }
        }

        .container { max-width: 600px; margin: 0 auto; padding: 20px; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            margin-bottom: 20px;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
            color: white;
        }
        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
        }
        .logo-text {
            background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .back-btn {
            color: #8b95a7;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 15px;
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
        }

        h1 { text-align: center; font-size: 26px; margin-bottom: 10px; }
        .subtitle { text-align: center; color: #8b95a7; font-size: 14px; margin-bottom: 30px; }

        .form-box {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 18px;
            padding: 25px 20px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 18px; }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #ccc;
            font-weight: 500;
        }
        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.15);
            background: rgba(0,0,0,0.3);
            color: white;
            font-size: 15px;
            font-family: inherit;
        }
        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #fd1d1d;
        }
        .form-group textarea { resize: vertical; min-height: 70px; }
        .form-group select { cursor: pointer; }
        .form-group select option { background: #1a1a2e; color: white; }

        .limit-note {
            display: block;
            margin-top: 6px;
            font-size: 12px;
            color: #a78bfa;
        }

        .submit-btn {
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(90deg, #833ab4, #fd1d1d, #fcb045);
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(253, 29, 29, 0.35);
        }
        .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(253, 29, 29, 0.5); }
        .submit-btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .loader { text-align: center; padding: 30px; display: none; }
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #fd1d1d;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .success {
            display: none;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #86efac;
            padding: 25px 20px;
            border-radius: 16px;
            text-align: center;
            font-size: 15px;
            line-height: 1.8;
        }
        .success .icon { font-size: 50px; margin-bottom: 15px; display: block; }

        .error {
            display: none;
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fca5a5;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .info-note {
            background: rgba(139, 92, 246, 0.08);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 15px;
            margin-top: 20px;
            font-size: 13px;
            color: #c4b5fd;
            line-height: 1.7;
            text-align: center;
        }

        .telegram-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px auto;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0088cc, #229ED9);
            border-radius: 12px;
            text-decoration: none;
            color: white;
            font-size: 15px;
            font-weight: 600;
            max-width: 100%;
            box-shadow: 0 4px 15px rgba(34, 158, 217, 0.4);
        }

        .instagram-float {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 20px auto 20px;
            padding: 12px 20px;
            background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
            border-radius: 50px;
            text-decoration: none;
            color: white;
            font-size: 14px;
            font-weight: 600;
            max-width: 280px;
        }
    </style>
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb1"></div>
        <div class="orb orb2"></div>
        <div class="orb orb3"></div>
    </div>

    <div class="container">
        <header>
            <a href="/" class="logo">
                <div class="logo-icon">⚡</div>
                <span class="logo-text">Dz Boost</span>
            </a>
            <a href="/" class="back-btn">← رجوع</a>
        </header>

        <h1>🚀 اطلب الآن</h1>
        <p class="subtitle">مجاناً • بدون تسجيل • سريع</p>

        <div class="error" id="error"></div>

        <div class="form-box" id="formBox">
            <form onsubmit="submitOrder(event)">
                <div class="form-group">
                    <label>👤 اسم المستخدم في إنستغرام</label>
                    <input type="text" id="username" placeholder="username (بدون @)" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label>🎯 نوع الخدمة</label>
                    <select id="service" required onchange="updateLimits()">
                        <option value="">-- اختر الخدمة --</option>
                        <option value="followers" data-min="10" data-max="50">📸 متابعين (10 - 50)</option>
                        <option value="views" data-min="100" data-max="500">👁️ مشاهدات (100 - 500)</option>
                        <option value="likes" data-min="50" data-max="300">❤️ إعجابات (50 - 300)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>📊 الكمية المطلوبة</label>
                    <input type="number" id="quantity" placeholder="اختر الخدمة أولاً" min="1" max="50000" required>
                    <span class="limit-note" id="limitNote">💡 اختر خدمة لعرض الحدود</span>
                </div>

                <div class="form-group">
                    <label>📝 ملاحظات (اختياري)</label>
                    <textarea id="notes" placeholder="أي تفاصيل إضافية..."></textarea>
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">
                    🚀 إرسال الطلب
                </button>
            </form>

            <div class="info-note">
                ⏳ <strong>ملاحظة:</strong> بعد كل طلب، يجب الانتظار <strong>24 ساعة</strong> قبل الطلب مرة أخرى.
            </div>
        </div>

        <div class="loader" id="loader">
            <div class="spinner"></div>
            <p>جاري إرسال طلبك...</p>
        </div>

        <div class="success" id="success">
            <span class="icon">✅</span>
            <strong>تم إرسال طلبك بنجاح!</strong><br>
            <span id="successMsg"></span>
            <br><br>
            <a href="/order" style="color: #86efac; text-decoration: underline;">طلب آخر</a>
        </div>

        <a href="{{ telegram_channel }}" target="_blank" class="telegram-btn">
            📢 انضم إلى قناة تلغرام
        </a>

        <a href="{{ instagram_url }}" target="_blank" class="instagram-float">
            📷 تابعني على إنستغرام
        </a>
    </div>

    <script>
        function updateLimits() {
            const select = document.getElementById('service');
            const option = select.options[select.selectedIndex];
            const quantityInput = document.getElementById('quantity');
            const limitNote = document.getElementById('limitNote');

            if (!select.value) {
                quantityInput.placeholder = 'اختر الخدمة أولاً';
                quantityInput.value = '';
                limitNote.textContent = '💡 اختر خدمة لعرض الحدود';
                return;
            }

            const min = option.getAttribute('data-min');
            const max = option.getAttribute('data-max');

            quantityInput.min = min;
            quantityInput.max = max;
            quantityInput.placeholder = `بين ${min} و ${max}`;
            quantityInput.value = '';
            limitNote.textContent = `💡 الحد الأدنى: ${min} — الحد الأقصى: ${max}`;
        }

        async function submitOrder(e) {
            e.preventDefault();

            const username = document.getElementById('username').value.trim();
            const service = document.getElementById('service').value;
            const quantity = document.getElementById('quantity').value;
            const notes = document.getElementById('notes').value.trim();

            const btn = document.getElementById('submitBtn');
            const loader = document.getElementById('loader');
            const formBox = document.getElementById('formBox');
            const success = document.getElementById('success');
            const error = document.getElementById('error');

            error.style.display = 'none';

            if (!username) {
                showError('⚠️ الرجاء إدخال اسم المستخدم');
                return;
            }

            if (!service) {
                showError('⚠️ الرجاء اختيار نوع الخدمة');
                return;
            }

            if (!quantity) {
                showError('⚠️ الرجاء إدخال الكمية');
                return;
            }

            formBox.style.display = 'none';
            loader.style.display = 'block';
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('username', username);
                formData.append('service', service);
                formData.append('quantity', quantity);
                formData.append('notes', notes);

                const response = await fetch('/api/order', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                loader.style.display = 'none';

                if (data.status === 'ok') {
                    document.getElementById('successMsg').textContent = data.message;
                    success.style.display = 'block';
                } else {
                    formBox.style.display = 'block';
                    btn.disabled = false;
                    showError('❌ ' + (data.message || 'فشل الإرسال'));
                }

            } catch (err) {
                loader.style.display = 'none';
                formBox.style.display = 'block';
                btn.disabled = false;
                showError('❌ خطأ: ' + err.message);
            }
        }

        function showError(msg) {
            const error = document.getElementById('error');
            error.textContent = msg;
            error.style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    </script>
</body>
</html>
